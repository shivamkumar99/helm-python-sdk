sonar.projectKey=helm-python-sdk
sonar.projectName=helm-python-sdk
sonar.projectVersion=0.2.0

sonar.sources=src,scripts,hatch_build.py
sonar.tests=tests
sonar.python.version=3.10,3.11,3.12,3.13
sonar.python.coverage.reportPaths=coverage.xml

sonar.sourceEncoding=UTF-8
# The bundled native library and virtualenvs are not source.
sonar.exclusions=src/helm_python/lib/**
# Coverage is measured on the shipped package. scripts/ are release/CI
# tooling (fetchers, checkers, the DAST probe) exercised by workflows, not
# by the unit suite; hatch_build.py runs only inside pip/build.
sonar.coverage.exclusions=scripts/**,hatch_build.py,tests/**
