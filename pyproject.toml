[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helm-python-sdk"
version = "0.2.1"
description = "Helm v4 SDK for Python — charts, OCI registries, and releases, with no helm binary required"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Shivam Kumar" }]
keywords = ["helm", "kubernetes", "charts", "oci", "sdk", "ctypes"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: System :: Systems Administration",
  "Typing :: Typed",
]
# No runtime dependencies: ctypes is in the standard library, and the native
# library ships inside the wheel.
dependencies = []

[project.urls]
Homepage = "https://github.com/shivamkumar99/helm-python-sdk"
"Native library" = "https://github.com/shivamkumar99/helm-c-sdk"

[project.optional-dependencies]
# hatchling is here so the build hook's tests actually run rather than
# silently skipping.
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "hatchling>=1.25", "build>=1.2", "wheel", "packaging"]

[tool.hatch.build.targets.wheel.hooks.custom]
# hatch_build.py: obtains the native library, building it from source when
# HELM_PYTHON_BUILD=1 (see PLAN.md section 3.1).
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
# The sdist is the build-from-source fallback, so it carries the vendored
# helm-c-sdk source (populated by scripts/vendor_helm_c.py). vendor/ is
# gitignored, and hatchling applies VCS ignores over `include`, so the
# vendored tree must ride force-include (below) or it silently vanishes
# from the sdist.
include = [
  "src/helm_python",
  "tests",
  "scripts",
  "hatch_build.py",
  "pyproject.toml",
  "README.md",
  "PLAN.md",
  "LICENSE",
  "NOTICE",
]

[tool.hatch.build.targets.sdist.force-include]
# Bypasses the VCS-ignore filter for the vendored helm-c-sdk source; the
# vendor script must run before building an sdist.
"vendor/helm-c" = "vendor/helm-c"

[tool.hatch.build.targets.wheel]
packages = ["src/helm_python"]
# The platform library is placed into src/helm_python/lib/ at wheel-build
# time (from a checksum-verified helm-c-sdk release) and shipped inside.
artifacts = ["src/helm_python/lib/*"]
# The wheel carries a native binary, so it is NOT pure Python: tag it with
# the build platform. Without this the wheel would be py3-none-any and pip
# would happily install a macOS dylib on Linux.
pure-python = false
infer-tag = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: exercises the real native library",
  "cluster: needs a reachable Kubernetes cluster (auto-skips without one)",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/helm_python"]

[tool.bandit]
# Tests use bare `assert` by design: pytest rewrites assertions, the suite is
# never shipped, and never runs under `python -O` (B101). The generator-run
# subprocess in the verify fixture uses a resolved binary and a fixed argv.
exclude_dirs = ["tests", ".venv", ".ci-venv"]

[tool.pylint.design]
# Config.__init__/install/upgrade and pull mirror the Helm CLI option surface
# as optional keyword-only parameters; the ABI carries them as a single
# opts_json document. Collapsing them into an options object would add
# indirection without any safety gain, so the project caps the limit at the
# widest such surface instead.
max-args = 20
