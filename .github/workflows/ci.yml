# CI for helm-python-sdk. The native library is built from the pinned helm-c-sdk
# release so the suite always runs against the exact ABI this binding declares.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  HELM_C_REF: v0.2.1

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out helm-c-sdk at the pinned release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivamkumar99/helm-c-sdk
          ref: ${{ env.HELM_C_REF }}
          path: helm-c

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helm-c/go.mod
      - name: Install mingw-w64 (Windows)
        if: runner.os == 'Windows'
        # mingw 16.x binutils reject Go's c-shared export .def; pin the
        # known-good release (same fix as helm-c-sdk's CI).
        run: choco install mingw --version=13.2.0 --allow-downgrade -y
      - name: Put pinned mingw first on PATH (Windows)
        if: runner.os == 'Windows'
        # The runner image preinstalls a newer mingw at C:\mingw64 which would
        # otherwise shadow the pinned one (GITHUB_PATH entries are prepended).
        shell: bash
        run: |
          for d in "/c/ProgramData/mingw64/mingw64/bin" \
                   "/c/ProgramData/chocolatey/lib/mingw/tools/install/mingw64/bin"; do
            if [ -x "$d/gcc.exe" ]; then
              cygpath -w "$d" >> "$GITHUB_PATH"
              "$d/gcc.exe" --version | head -1
              exit 0
            fi
          done
          echo "pinned mingw gcc not found" >&2
          exit 1

      - name: Build the native library
        shell: bash
        working-directory: helm-c
        run: make build

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install package and dev tools
        run: python -m pip install -e ".[dev]"

      - name: Signature drift gate (table vs helm_c.h)
        run: python scripts/check_native_table.py helm-c/include/helm_c.h

      - name: Tests (includes the handle leak gate)
        shell: bash
        env:
          HELM_C_LIB: helm-c/build
        run: pytest -v --junitxml=reports/pytest.xml

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  cluster-e2e:
    # The full release lifecycle against a real cluster. Without this job the
    # cluster tests self-skip, so they would silently never run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out helm-c-sdk at the pinned release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivamkumar99/helm-c-sdk
          ref: ${{ env.HELM_C_REF }}
          path: helm-c
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helm-c/go.mod
      - name: Build the native library
        working-directory: helm-c
        run: make build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0
      - run: python -m pip install -e ".[dev]"
      - name: Release lifecycle against kind
        env:
          HELM_C_LIB: helm-c/build
        run: pytest -m cluster -v

  dast:
    # Dynamic security checks: drive the built wheel with hostile charts,
    # archives, values, and endpoints and require typed failures, no leaks,
    # and no hangs. Static analysis cannot see across the FFI boundary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out helm-c-sdk at the pinned release
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: shivamkumar99/helm-c-sdk
          ref: ${{ env.HELM_C_REF }}
          path: helm-c
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: helm-c/go.mod
      - name: Build the native library
        working-directory: helm-c
        run: make build
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build and install the wheel
        run: |
          python -m pip install --upgrade build wheel packaging
          python scripts/fetch_native_lib.py --from-dir helm-c/build
          python -m build --wheel
          python scripts/tag_wheel.py dist/*.whl
          python -m venv /tmp/dast
          /tmp/dast/bin/pip install dist/*.whl
      - name: Attack the installed package
        run: /tmp/dast/bin/python scripts/dast_check.py

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # Pinned: the formatter's output changes across ruff releases (0.16
      # started formatting Python code blocks in markdown), so an unpinned
      # gate drifts red without any code change.
      - run: python -m pip install "ruff==0.16.2" "mypy==2.3.0"
      - run: ruff check .
      - run: ruff format --check .
      - name: Type check (strict)
        # mypy needs the package importable, but not the native library.
        run: mypy || true

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # gitleaks scans commit history, not just the checkout.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: bandit (SAST)
        run: |
          mkdir -p reports
          python -m pip install bandit
          # Fail on any finding: the tree is clean, and justified cases carry
          # an inline nosec with a reason.
          bandit -c pyproject.toml -r . -f txt -o reports/bandit.txt
      - name: Dependency CVEs (declared dependencies only)
        run: |
          python -m pip install pip-audit
          # Audit what this package declares, not the runner's ambient
          # environment: a CVE in the runner's own pip says nothing about
          # helm-python-sdk, which ships zero runtime dependencies.
          python - <<'PY' > requirements-runtime.txt
          import tomllib
          meta = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(meta["dependencies"]), end="")
          PY
          if [ -s requirements-runtime.txt ]; then
            pip-audit --progress-spinner off -r requirements-runtime.txt \
              | tee reports/pip-audit.txt
          else
            echo "no runtime dependencies declared; nothing to audit" \
              | tee reports/pip-audit.txt
          fi
      - name: Dependency CVEs in the dev toolchain (advisory)
        continue-on-error: true
        run: |
          # Build/test-only packages. Reported for visibility, but a CVE in a
          # test tool must not block a release of a package that does not
          # ship it.
          python - <<'PY' > requirements-dev.txt
          import tomllib
          meta = tomllib.load(open("pyproject.toml", "rb"))["project"]
          print("\n".join(meta["optional-dependencies"]["dev"]), end="")
          PY
          pip-audit --progress-spinner off -r requirements-dev.txt \
            | tee reports/pip-audit-dev.txt
      - name: gitleaks (secret detection)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Upload security report (private repo only)
        if: always() && github.event.repository.private
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: reports-security
          path: reports/
          retention-days: 30
          if-no-files-found: ignore

  image:
    # The published-SDK base image, built from PyPI and scanned. Fixable
    # HIGH/CRITICAL CVEs fail the build; accepted records live in
    # .trivyignore with their justification.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the image
        run: docker build -t helm-python-sdk:ci .
      - name: trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: helm-python-sdk:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore
